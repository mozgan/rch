    archive_type: gz
    inner_path: Armadillo.ply
    canonical_format: binary_big_endian_ply
    expected_vertices: 172974
    expected_faces: 345944
    source_note: Stanford page reports vripped reconstruction and 345944 triangles; local PLY header reports 172974 vertices.
