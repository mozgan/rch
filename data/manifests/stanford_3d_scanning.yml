    expected_vertices: 35947
    expected_faces: 69451
    source_note: Stanford page reports zipper reconstruction, 35947 vertices and 69451 triangles.
  - id: stanford_armadillo
    label: Stanford Armadillo
    url: https://graphics.stanford.edu/pub/3Dscanrep/armadillo/Armadillo.ply.gz
    filename: Armadillo.ply.gz
