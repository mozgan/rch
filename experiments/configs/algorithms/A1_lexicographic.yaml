# A1 baseline.
#
# Lexicographic sort applies no quantization, so its output is independent of the
# bit rule and it participates in no paired gate; it runs a single representative
# rule to avoid emitting identical duplicate rows.
id: A1_lexicographic
label: A1 Lexicographic
method: lexicographic
supported_bit_rules:
  - C0_uniform
include_in_tables: true
