# Separate seeds from primary study; limited size sensitivity, not a full n factorial.
schema: rch.runlist.v1
name: regime_map_size_sensitivity
algorithm_ids:
- A3_isotropic_hilbert
- A5_pca_compact_hilbert
- A6_rch
bit_rules:
- id: C0_uniform
  label: C0 uniform 10 bits per axis
  bit_allocator: uniform
  uniform_bits: 10
  min_axis_bits: 1
- id: C2_occupancy_floor1
  label: C2 occupancy floor1
  bit_allocator: occupancy_floor1
  allocation_model: covering_occupancy_floor1
  budget_projection: minimax_worst_cell_edge
  uniform_bits: 10
  min_axis_bits: 1
- id: C3_frame_core_occupancy
  label: C3 frame-core occupancy
  bit_allocator: frame_core_occupancy
  allocation_model: robust_core_occupancy
  budget_projection: minimax_worst_cell_edge
  uniform_bits: 10
  min_axis_bits: 1
- id: C4_hybrid
  label: C4 hybrid
  bit_allocator: hybrid_occupancy
  allocation_model: robust_core_delta_covering_occupancy
  budget_projection: minimax_worst_cell_edge
  uniform_bits: 10
  min_axis_bits: 1
contamination_ids:
- D0
- D1
- D2
- D3
- D4
geometry_ids:
- R_volume_triaxial
- R_surface_triaxial
- R_curve_triaxial
- R_clustered_triaxial
point_counts:
- 4096
seeds:
- 20
- 21
- 22
- 23
- 24
metrics:
- miad
- kendall_tau_clean
independent_sampling: true
