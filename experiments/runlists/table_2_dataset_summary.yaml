# table_2_dataset_summary.yaml — real-data runlist
schema: rch.real_runlist.v1
name: table_2_dataset_summary
dataset_manifest: data/manifests/stanford_3d_scanning.yml
processed_dir: data/processed/stanford_3d_scanning
dataset_ids: [stanford_bunny, stanford_armadillo]
#dataset_ids: [stanford_bunny, stanford_armadillo, stanford_dragon, stanford_lucy]
geometry_ids:
  stanford_bunny: E3
  stanford_armadillo: E4
#  stanford_dragon: E5
#  stanford_lucy: E6
algorithm_ids:
  - A0_input
  - A1_lexicographic
  - A2_morton
  - A3_isotropic_hilbert
  - A4_compact_hilbert_aabb
  - A5_pca_compact_hilbert
  - A5b_robust_frame_morton
  - A6_rch
  - A6_rch_b2_mrcd
  - A6_rch_b3_ogk
  - A7_cgal_spatial_sort
bit_rules:
  - id: C0_uniform
    label: C0 uniform (10 bits/axis)
    bit_allocator: uniform
    allocation_model: fixed_equal_depth
    budget_projection: equal_depth_axis_cap
    uniform_bits: 10
    min_axis_bits: 1
  - id: C1_monotone_half
    label: C1 monotone-half
    bit_allocator: monotone_half
    allocation_model: extent_ranked_monotone_half
    budget_projection: extent_ranked_half_budget
    uniform_bits: 10
    min_axis_bits: 1
  - id: C2_occupancy_floor1
    label: C2 occupancy floor1
    bit_allocator: occupancy_floor1
    allocation_model: covering_occupancy_floor1
    budget_projection: minimax_worst_cell_edge
    uniform_bits: 10
    min_axis_bits: 1
  - id: C3_frame_core_occupancy
    label: C3 frame-core occupancy
    bit_allocator: frame_core_occupancy
    allocation_model: robust_core_occupancy
    budget_projection: minimax_worst_cell_edge
    uniform_bits: 10
    min_axis_bits: 1
  - id: C4_hybrid
    label: C4 hybrid
    bit_allocator: hybrid_occupancy
    allocation_model: robust_core_delta_covering_occupancy
    budget_projection: minimax_worst_cell_edge
    uniform_bits: 10
    min_axis_bits: 1
# Real scans are evaluated as acquired/processed. Synthetic outlier injection
# is reserved for Synthetic runlists so the Real axis is not confounded by an
# additional artificial D-axis.
contamination_ids: [D0]
seeds: [0, 1, 2, 3, 4]
metrics:
  - miad
  - normalized_miad
  - m1_l1_locality
  - m1_l1_sampled
  - m1_l2_locality
  - m1_l2_sampled
  - recall_8_64
  - recall_8_64_sampled
  - kendall_tau_clean
  - frame_angle_rad
  - peak_rss_kb
  - cache_references
  - cache_misses
  - cache_miss_rate
  - perf_status
  - block_read_mean
  - block_read_p95
  - sort_seconds
