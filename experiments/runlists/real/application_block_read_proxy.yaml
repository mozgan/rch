# A short real-data feasibility run for the existing simulated block-read probe.
# This is explicitly a proxy, not an end-to-end indexed spatial query benchmark.
schema: rch.real_runlist.v1
name: application_block_read_proxy
dataset_manifest: data/manifests/stanford_3d_scanning.yml
processed_dir: data/processed/stanford_3d_scanning
dataset_ids: [stanford_bunny]
geometry_ids:
  stanford_bunny: E3
algorithm_ids: [A0_input, A3_isotropic_hilbert, A6_rch]
bit_rules:
  - id: C0_uniform
    label: C0 uniform (10 bits/axis)
    bit_allocator: uniform
    allocation_model: fixed_equal_depth
contamination_ids: [D0]
seeds: [0]
metrics:
  - block_read_mean
  - block_read_p95
  - cache_references
  - cache_misses
  - cache_miss_rate
  - perf_status
  - sort_seconds
